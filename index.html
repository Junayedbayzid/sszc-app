<style>
  :root{
    --ink:#1E2320;
    --ink-soft:#4A5049;
    --paper:#F1F0EA;
    --paper-raised:#FFFFFF;
    --line:#D7D4C9;
    --amber:#D98F2B;
    --amber-deep:#B87420;
    --steel:#3D5A73;
    --steel-deep:#2C4356;
    --brick:#A6403A;
    --green:#4C7A52;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Manrope','Noto Sans Bengali',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  :lang(bn), .bn{font-family:'Noto Sans Bengali','Manrope',sans-serif;}
  h1,h2,h3,h4{font-family:'Noto Sans Bengali','Manrope',sans-serif; margin:0; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #app{max-width:1100px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--ink); color:var(--paper);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--ink); flex-shrink:0;
  }
  .brand-text{line-height:1.15;}
  .brand-text .name{font-weight:800; font-size:15px;}
  .brand-text .tag{font-size:11px; opacity:0.65;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .lang-toggle{
    display:flex; background:rgba(255,255,255,0.1); border-radius:20px; padding:2px; font-size:12px;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--paper); padding:5px 12px; border-radius:18px; font-weight:600;
  }
  .lang-toggle button.active{background:var(--amber); color:var(--ink);}
  .who{font-size:12px; opacity:0.8; text-align:right;}
  .who b{display:block; font-size:13px; opacity:1;}
  .logout-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.3); color:var(--paper);
    border-radius:8px; padding:6px 10px; font-size:12px;
  }

  /* ---------- Body layout ---------- */
  .body-wrap{flex:1; display:flex; padding-bottom:70px;}
  nav.side{
    width:190px; flex-shrink:0; padding:16px 10px; border-right:1px solid var(--line);
  }
  nav.side button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:10px 12px; border:none; background:transparent; border-radius:8px;
    font-size:14px; font-weight:600; color:var(--ink-soft); margin-bottom:2px;
  }
  nav.side button .num{
    font-size:11px; width:20px; height:20px; border-radius:50%; background:var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:700;
  }
  nav.side button.active{background:var(--ink); color:var(--paper);}
  nav.side button.active .num{background:var(--amber); color:var(--ink);}
  nav.side button .badge{
    margin-left:auto; background:var(--brick); color:#fff; font-size:10px; font-weight:800;
    padding:1px 6px; border-radius:10px;
  }
  main{flex:1; padding:20px; min-width:0;}

  /* mobile bottom nav */
  nav.bottom{
    display:none; position:fixed; bottom:0; left:0; right:0; background:var(--paper-raised);
    border-top:1px solid var(--line); justify-content:space-around; padding:6px 2px;
    max-width:1100px; margin:0 auto;
  }
  nav.bottom button{
    display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
    color:var(--ink-soft); font-size:10px; font-weight:700; padding:4px 6px; position:relative;
  }
  nav.bottom button.active{color:var(--amber-deep);}
  nav.bottom .dot{
    position:absolute; top:0; right:6px; width:8px; height:8px; border-radius:50%; background:var(--brick);
  }

  @media (max-width:760px){
    nav.side{display:none;}
    nav.bottom{display:flex;}
    main{padding:14px;}
    .body-wrap{padding-bottom:64px;}
  }

  /* ---------- Cards / sections ---------- */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .section-head h2{font-size:19px;}
  .section-head p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft);}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .card-title{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
    border-left:4px solid var(--amber);
  }
  .stat.neg{border-left-color:var(--brick);}
  .stat.pos{border-left-color:var(--green);}
  .stat .label{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-size:21px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:none; color:var(--ink-soft); font-weight:700; padding:8px 6px; border-bottom:2px solid var(--line);}
  td{padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .num-cell{font-variant-numeric:tabular-nums; text-align:right; font-weight:700;}
  .pos-text{color:var(--green);}
  .neg-text{color:var(--brick);}

  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700;}
  .pill.pending{background:#FBE9D0; color:var(--amber-deep);}
  .pill.approved{background:#DEEBE0; color:var(--green);}
  .pill.rejected{background:#F3DBD9; color:var(--brick);}

  .btn{
    border:none; border-radius:8px; padding:9px 15px; font-weight:700; font-size:13px;
    background:var(--ink); color:var(--paper);
  }
  .btn.amber{background:var(--amber); color:var(--ink);}
  .btn.steel{background:var(--steel); color:#fff;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn.small{padding:5px 10px; font-size:11.5px; border-radius:6px;}
  .btn.danger{background:var(--brick); color:#fff;}
  .btn.green{background:var(--green); color:#fff;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--paper);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:500px){.row2{grid-template-columns:1fr;}}

  .site-card{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .site-card:hover{border-color:var(--amber);}
  .site-card .idx{
    width:34px; height:34px; border-radius:8px; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--ink-soft); flex-shrink:0;
  }
  .site-card .info{flex:1; min-width:0;}
  .site-card .info .name{font-weight:800; font-size:15px;}
  .site-card .info .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,22,20,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--paper); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; padding:20px; animation:slideup 0.18s ease-out;
  }
  @media (min-width:760px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:14px;}
  }
  @keyframes slideup{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-head h3{font-size:17px;}
  .close-x{background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1; padding:4px;}

    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{width:100%; max-width:380px;}
  .login-brand{text-align:center; margin-bottom:24px;}
  .login-brand .brand-mark{margin:0 auto 10px; width:52px; height:52px; font-size:18px; border-radius:12px;}
  .login-brand h1{font-size:22px;}
  .login-brand p{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .partner-pick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .partner-btn{
    background:var(--paper-raised); border:2px solid var(--line); border-radius:12px; padding:16px 10px;
    text-align:center; font-weight:700; font-size:14px;

  .partner-btn .avatar{
    width:40px; height:40px; border-radius:50%; background:var(--steel); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; margin:0 auto 8px;

  .setup-note{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:14px;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,0.2);
  }
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .helper{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .receipt-thumb{
    width:100%; max-height:140px; object-fit:cover; border-radius:8px; margin-top:8px; border:1px solid var(--line);
  }
  .file-input-wrap{
    border:1.5px dashed var(--line); border-radius:8px; padding:12px; text-align:center; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
</style>
</head>

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

// ===================== Storage helpers (Firestore collections) =====================
// Each partner/site/entry is its own document — keeps documents small (important
// because receipt photos are stored inline) and lets us listen for live changes.
function col(name){ return db.collection(name); }

async function fsSetDoc(collectionName, id, data){
  const clean = JSON.parse(JSON.stringify(data)); // strip undefined
  await col(collectionName).doc(id).set(clean);
}
async function fsUpdateDoc(collectionName, id, patch){
  await col(collectionName).doc(id).update(patch);
}
async function fsDeleteDoc(collectionName, id){
  await col(collectionName).doc(id).delete();
}
// Live-listen a collection into a STATE array, re-rendering on every remote change.
function fsListen(collectionName, targetArrayKey){
  col(collectionName).onSnapshot((snap)=>{
    STATE[targetArrayKey] = snap.docs.map(d=>d.data());
    if(!STATE.loading) render();
  }, (err)=>{
    console.error('listen error', collectionName, err);
    showToast('সিঙ্ক এরর — Firestore rules/config চেক করো');
  });
}

function localStorage_safe_get(k){ return _memLang; }
function localStorage_safe_set(k,v){ _memLang = v; }

// ===================== Computation engine =====================
// Returns per-site financial summary from APPROVED entries only
function computeSiteSummary(siteId){
  const site = STATE.sites.find(s=>s.id===siteId);
  if(!site) return null;
  const siteEntries = STATE.entries.filter(e=>e.siteId===siteId && e.status==='approved');
  const expenses = siteEntries.filter(e=>e.type==='expense');
  const incomes = siteEntries.filter(e=>e.type==='income');
  const totalExpense = expenses.reduce((s,e)=>s+Number(e.amount||0),0);

  let totalDistributable = 0;
  const incomeBreakdown = incomes.map(inc=>{
    const gross = Number(inc.revenue||0) - Number(inc.workerSalary||0);
    const kafeelCut = gross * (Number(site.kafeelPercent||0)/100);
    let net = gross - kafeelCut;
    let investorCut = 0;
    if(site.investor && site.investor.percent){
      investorCut = net * (Number(site.investor.percent)/100);
      net = net - investorCut;
    }
    totalDistributable += net;
    return {entry:inc, gross, kafeelCut, investorCut, net};
  });

  return {site, expenses, incomes, incomeBreakdown, totalExpense, totalDistributable, perPartnerShare: totalDistributable/4};
}

// General / office expenses not tied to any site yet (siteId is null)
function computeGeneralSummary(){
  const entries = STATE.entries.filter(e=>!e.siteId && e.type==='expense' && e.status==='approved');
  const total = entries.reduce((s,e)=>s+Number(e.amount||0),0);
  return {expenses: entries, total};
}

// Combined ledger per partner across ALL sites + all approved entries
function computePartnerBalances(){
  const balances = {};
  STATE.partners.forEach(p=> balances[p.id] = 0);
  STATE.sites.forEach(site=>{
    const sum = computeSiteSummary(site.id);
    if(!sum) return;
    // credit: expenses each partner personally paid (fronted cash), owed back to them
    sum.expenses.forEach(e=>{
      if(balances[e.paidBy] !== undefined) balances[e.paidBy] += Number(e.amount||0);
    });
    // credit: equal profit share per approved income entry
    sum.incomeBreakdown.forEach(ib=>{
      STATE.partners.forEach(p=>{ balances[p.id] += ib.net/4; });
    });
  });
  // credit: general/office expenses (not yet linked to a site) — still owed back to whoever paid
  computeGeneralSummary().expenses.forEach(e=>{
    if(balances[e.paidBy] !== undefined) balances[e.paidBy] += Number(e.amount||0);
  });
  // debit: withdrawals
  STATE.entries.filter(e=>e.type==='withdrawal' && e.status==='approved').forEach(w=>{
    if(balances[w.paidBy] !== undefined) balances[w.paidBy] -= Number(w.amount||0);
  });
  return balances;
}

function pendingCount(){
  return STATE.entries.filter(e=>e.status==='pending').length;

      <input type="file" id="f_receipt" accept="image/*" style="display:none" onchange="previewReceipt(this)">
      <img id="receiptPreview" class="receipt-thumb" style="display:none;">
    </div>`;
}
let _pendingReceipt = null;
function previewReceipt(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 8*1024*1024){ showToast('Image too large (max 8MB)'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const tempImg = new Image();
    tempImg.onload = function(){
      // downscale + compress so the stored doc stays well under Firestore's 1MB limit
      const MAX_DIM = 1000;
      let w = tempImg.width, h = tempImg.height;
      if(w > MAX_DIM || h > MAX_DIM){
        const scale = MAX_DIM / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(tempImg, 0, 0, w, h);
      let quality = 0.7;
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      while(dataUrl.length > 650000 && quality > 0.25){
        quality -= 0.15;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }
      _pendingReceipt = dataUrl;
      const img = document.getElementById('receiptPreview');
      img.src = dataUrl; img.style.display='block';
    };
    tempImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function submitExpense(siteId){
  const amount = parseFloat(document.getElementById('f_amt').value);
  const description = document.getElementById('f_desc').value.trim();
  const paidBy = document.getElementById('f_paidBy').value;
  if(!amount || amount<=0){ showToast('Amount?'); return; }
  if(!_pendingReceipt){ document.getElementById('receiptRequiredNote').style.display='block'; return; }
  await addEntry({siteId: siteId||null, type:'expense', amount, description, paidBy, receipt:_pendingReceipt});
  _pendingReceipt = null;
  closeModal();
  showToast(t('entrySaved'));
  renderRoute();
}

    <button class="btn amber" style="width:100%; margin-top:6px;" onclick="submitIncome('${siteId}')">${t('submit')}</button>

async function submitIncome(siteId){

// ===================== Approvals =====================
function viewApprovals(){
  const me = STATE.partners.find(p=>p.id===STATE.currentUser);
  const pending = STATE.entries.filter(e=>e.status==='pending').sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <div class="section-head"><div><h2>${t('approvals')}</h2>${!me.isAdmin?`<p>${t('adminOnly')}</p>`:''}</div></div>
    ${pending.length===0 ? `<div class="empty">${t('noPending')}</div>` : pending.map(e=>{
      const site = STATE.sites.find(s=>s.id===e.siteId);
      let desc='';
      if(e.type==='expense') desc = `${t('addExpense')} — ${money(e.amount)} — ${escapeHtml(e.description||'')}`;
      else if(e.type==='income') desc = `${t('addIncome')} — ${t('revenue')}: ${money(e.revenue)}, ${t('workerSalary')}: ${money(e.workerSalary)}`;
      else desc = `${t('withdraw')} — ${money(e.amount)}`;
      return `
      <div class="card">
        <div class="flex-between" style="margin-bottom:8px;">
          <div>
            <div style="font-weight:800; font-size:14px;">${site?escapeHtml(site.name):t('generalExpenses')}</div>
            <div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">${desc}</div>
            <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">${t('submittedBy')}: ${escapeHtml(partnerName(e.submittedBy))} · ${fmtDate(e.createdAt)}</div>
          </div>
          <span class="pill pending">${t('pending')}</span>
        </div>
        ${e.receipt?`<img src="${e.receipt}" class="receipt-thumb">`:''}
        ${me.isAdmin ? `
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn green small" onclick="approveEntry('${e.id}')">${t('approve')}</button>
          <button class="btn danger small" onclick="rejectEntry('${e.id}')">${t('reject')}</button>
        </div>` : ''}
      </div>`;
    }).join('')}
  `;
}
async function approveEntry(id){ await setEntryStatus(id,'approved'); showToast(t('approvedMsg')); renderRoute(); }
async function rejectEntry(id){ await setEntryStatus(id,'rejected'); showToast(t('rejectedMsg')); renderRoute(); }

function attachSettingsHandlers(){ /* using inline onclick, nothing extra needed */ }
async function submitAddPartner(){
  const name = document.getElementById('np_name').value.trim();
  const pin = document.getElementById('np_pin').value.trim();
  if(!name || !pin){ showToast('Name + PIN?'); return; }
  const isAdmin = STATE.partners.length===0; // first partner defaults to admin, changeable
  await addPartner(name, pin, isAdmin);
  showToast(t('partnerAdded'));
  renderRoute();
}
async function makeAdmin(id){
  STATE.partners.forEach(p=> p.isAdmin = (p.id===id));
  await updatePartners();
  renderRoute();
}
function finishFirstSetup(){
  STATE.currentUser = null;
  STATE.route = 'dashboard';
  render();
}

// ===================== Modal helper =====================
function openModal(innerHtml){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.id='modalBackdrop';
  backdrop.onclick = (ev)=>{ if(ev.target===backdrop) closeModal(); };
  backdrop.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(backdrop);
}
function closeModal(){
  const el = document.getElementById('modalBackdrop');
  if(el) el.remove();
  _pendingReceipt = null;
}

// ===================== Init =====================
async function init(){
  try{
    await auth.signInAnonymously();
  }catch(e){
    console.error('auth failed', e);
    document.getElementById('app').innerHTML =
      '<div class="login-wrap"><div class="card" style="max-width:420px;"><b>Firebase কনফিগ ঠিক নেই।</b><br><br>'+
      'index.html-এর উপরের দিকে <code>firebaseConfig</code> অংশে তোমার নিজের Firebase প্রজেক্টের মান বসাও, '+
      'আর Firebase Console &gt; Authentication &gt; Sign-in method-এ "Anonymous" চালু আছে কিনা চেক করো।</div></div>';
    return;
  }
  fsListen('partners', 'partners');
  fsListen('sites', 'sites');
  fsListen('entries', 'entries');
  // give the first snapshot a moment to arrive before first render
  setTimeout(()=>{ STATE.loading = false; render(); }, 600);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('sw failed', err));
  }
}
init();
</script>
